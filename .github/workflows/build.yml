name: Build VoiceInk
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream tag or branch to build
        default: main
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Clone upstream VoiceInk
        run: git clone --depth 1 --branch "${{ github.event.inputs.ref }}" https://github.com/Beingpax/VoiceInk.git src
      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $X"; sudo xcode-select -s "$X"; xcodebuild -version; swift --version
      - name: Allow package plugins and macros in CI
        run: |
          defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidation -bool YES
          defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Build local (ad-hoc signed)
        working-directory: src
        run: make local LOCAL_CODESIGN_IDENTITY=-
      - name: Package
        run: |
          ls -la ~/Downloads
          cd ~/Downloads && ditto -c -k --keepParent VoiceInk.app VoiceInk.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceInk
          path: ~/Downloads/VoiceInk.zip
